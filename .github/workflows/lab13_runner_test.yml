name: Lab 13 - Self Hosted Runner Test

on:
  push:
    branches:
      - lab13-integration
      - master
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      runner:
        description: "Runner environment"
        required: true
        default: "ubuntu-latest"
        type: choice
        options:
          - "ubuntu-latest"
          - "macos-latest"
          - "self-hosted"

jobs:
  test-runner:
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check Python
        run: python --version

      - name: Check Git
        run: git --version

      - name: Check Docker
        run: |
          if command -v docker >/dev/null 2>&1; then
            docker --version
          else
            echo "[INFO] Docker CLI is not installed or not active."
          fi

      - name: Check Kubernetes
        run: |
          if command -v kubectl >/dev/null 2>&1; then
            kubectl version --client || true
          else
            echo "[INFO] kubectl is not installed."
          fi

      - name: Check Project
        run: |
          echo "Runner: $RUNNER_NAME"
          echo "Workspace: $GITHUB_WORKSPACE"
          test -f config.yaml && echo "[OK] config.yaml exists"
          test -f data/raw/churn.csv && echo "[OK] churn.csv exists"
          test -f src/mlops_pipeline/churn_prediction_pipeline.py && echo "[OK] pipeline script exists"
